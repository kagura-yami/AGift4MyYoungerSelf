server {
    listen 80;
    server_name _;
    location = /downloads/Tripothon-Windows.zip {
        alias /srv/downloads/Tripothon-Windows.zip;
        default_type application/zip;
        add_header Content-Disposition 'attachment; filename="Tripothon-Windows.zip"' always;
        add_header X-Content-Type-Options nosniff always;
        sendfile on;
    }
    location / { return 404; }
}

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Tripo · 能力手册 / 生图素材版</title><style>
*{box-sizing:border-box}body{margin:0;background:#15251f url(scene.png) center/cover fixed;color:#f1e5c6;font-family:"Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}body:before{content:"";position:fixed;inset:0;background:#071510b8;backdrop-filter:blur(6px);z-index:-1}header,footer{display:flex;align-items:center;justify-content:space-between;padding:14px 4vw;font-size:12px;letter-spacing:2px}header{height:52px}header strong{font-size:17px}header span,footer{color:#c3c7b4}main{flex:1;min-height:0;display:grid;place-items:center}.book{position:relative;width:min(96vw,calc((100vh - 94px)*1.5));aspect-ratio:1.5;background:url(skill-book-generated.png) center/100% 100%;filter:drop-shadow(0 18px 22px #0007);container-type:inline-size}.heading{position:absolute;left:40%;top:9%;color:#304137;font-size:2.6cqw;font-weight:600;letter-spacing:.3cqw}.heading small{font-size:.9cqw;font-weight:400;margin-left:2cqw;color:#7d7157;letter-spacing:.15cqw}.rows{position:absolute;left:7.5%;top:14%;width:24.3%;height:68.5%;display:grid;grid-template-rows:repeat(8,1fr);gap:1.15%}.skill{font:inherit;color:#f1e6cb;border:1px solid transparent;background:none;display:flex;align-items:center;gap:.7cqw;padding:.2cqw .9cqw;cursor:pointer;text-align:left;transition:background .15s,transform .15s}.skill:hover{background:#e7cf8830;transform:translateX(3px)}.skill.active{background:linear-gradient(90deg,#bd84447a,#d8b45b28);border-color:#d4b8719c;box-shadow:inset 3px 0 #f0ce84}.icon{display:block;width:4.1cqw;height:4.1cqw;flex-shrink:0;border-radius:50%;background-image:url(skill-icons-generated.png);background-size:400% 200%;box-shadow:0 2px 4px #0005}.skill b{font-size:1.25cqw;font-weight:500;flex:1}.skill small{font-size:.9cqw;color:#d9c992}.detail{position:absolute;left:41%;top:62%;width:51%;height:20%;color:#324137}.detail h2{font-size:2.2cqw;margin:0 0 .5cqw;font-weight:600}.detail p{font-size:1.1cqw;line-height:1.8;margin:.4cqw 0}.stats{display:flex;gap:3cqw;margin:1.25cqw 0}.stats small{display:block;font-size:.85cqw;color:#746e59}.stats b{font-size:1.55cqw;font-weight:500}.key{display:inline-block;padding:.1cqw .7cqw;border:1px solid #8c866f;font-size:1cqw;border-radius:3px;margin-right:.6cqw}.tip{font-size:.85cqw!important;color:#6e705b}.back{position:absolute;left:79.2%;top:79.1%;width:14%;height:5.4%;border:0;background:none;color:#f3e6c1;cursor:pointer;font:inherit;font-size:1.25cqw;letter-spacing:.3cqw}.back:hover{color:#ffd47a}.artnote{position:absolute;top:56%;left:41%;font-size:.65cqw;padding:.3cqw .6cqw;color:#fff3d9;background:#23372dc9}.book.other .artnote{font-size:.85cqw}.book.other:after{content:"";position:absolute;left:39.5%;top:19%;width:54%;height:39%;background:#1e352fde;pointer-events:none}.bigicon{display:none;position:absolute;z-index:2;left:57%;top:25%;width:19%;aspect-ratio:1;border-radius:50%;background-image:url(skill-icons-generated.png);background-size:400% 200%;box-shadow:0 12px 30px #0005}.book.other .bigicon{display:block}.book.other .artnote{z-index:3}footer{height:42px;font-size:10px;letter-spacing:1px}footer a{color:#d9c18b}.message{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);padding:12px 25px;background:#284537;border:1px solid #9b976c;display:none;font-size:14px}@media(max-width:800px){main{overflow:auto;display:block;padding-top:10px}.book{width:950px;margin:0 auto}header span{display:none}footer{font-size:10px}.mobile{display:block}}@media(min-width:801px){.mobile{display:none}}
</style><header><strong>TRIPO · 给过去的自己</strong><span>回忆收藏 / 能力手册</span></header><main><div class="book" id="book"><div class="heading">能力手册 <small>收好每一份力量</small></div><div class="rows" id="rows"></div><div class="bigicon" id="big"></div><div class="artnote" id="artnote">二段跳概念插画 · 角色为风格示意</div><section class="detail"><h2 id="name"></h2><p id="desc"></p><div class="stats"><div><small id="label"></small><b id="value"></b></div><div><small>冷却时间</small><b id="cool"></b></div><div><small>当前等级</small><b>Ⅱ / Ⅲ</b></div></div><p class="tip"><span class="key" id="key"></span><span id="tip"></span></p></section><button class="back" id="back">收起手册</button></div></main><footer><span>生图素材设计稿 · 演示数据，未接入游戏 <span class="mobile">· 横向滚动查看完整面板</span></span><a href="v1.html">查看第一版</a></footer><div class="message" id="message">视觉样稿：正式游戏中此处返回游戏</div><script>
const data=[['平面位移','沿移动方向快速前进，跨过眼前的间隙。','位移距离','4.18 m','1.2 s','Shift','空中次数使用后，落地恢复。'],['上位移','带着前进的惯性再次跃起，越过原本够不到的落点。','次数恢复','落地','2.0 s','Ctrl','施加向上初速度，随后自然减速上升、下落。'],['蹬墙跳','借助墙面向外弹起，寻找新的落脚点。','使用条件','有效墙面','0.2 s','Space','空中面向可蹬跳的墙面使用。'],['垫脚石','放置一块临时石台，为自己搭出下一步。','容量 / 存续','2 块 / 10 s','2.0 s','Q','按住预览，松开放置；需要有效空间。'],['局部减慢','放慢前方移动平台，给下一步多一点时间。','速度 / 持续','40% / 4 s','8.0 s','F','6 米内选中可受时间影响的平台。'],['时回','沿着走过的轨迹，让自己或平台返回。','回溯上限','5 s','10 s','R / T','自身 / 平台，共享冷却。'],['分身','让过去的自己重演行动，与你完成配合。','回放上限','4 s','10 s','C','再次按下取消，冷却继续计算。'],['奖励加时','在挑战开始时，增加奖励判定的时间预算。','额外时间','+10 s','—','被动','开始挑战时自动计入，无需施放。']];
const $=x=>document.getElementById(x);const pos=i=>(i%4)*100/3+'% '+Math.floor(i/4)*100+'%';
data.forEach((d,i)=>{const b=document.createElement('button');b.className='skill';b.innerHTML='<span class="icon" style="background-position:'+pos(i)+'"></span><b>'+d[0]+'</b><small>Ⅱ</small>';b.onclick=()=>pick(i);$('rows').append(b)});
function pick(i){const d=data[i];['name','desc','label','value','cool','key','tip'].forEach((id,j)=>$(id).textContent=d[j]);document.querySelectorAll('.skill').forEach((b,j)=>b.classList.toggle('active',i===j));$('book').classList.toggle('other',i!==1);$('big').style.backgroundPosition=pos(i);$('artnote').textContent=i===1?'二段跳概念插画 · 角色为风格示意':'技能徽章 · '+d[0]}pick(1);$('back').onclick=()=>{$('message').style.display='block';setTimeout(()=>$('message').style.display='none',2200)};
</script></html>
